
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>R9 Nova TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, \'SF Pro Display\', \'Helvetica Neue\', sans-serif;
        }

        body {
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 0 0 80px 0;
            transition: background 0.3s, color 0.3s;
        }

        body.light-mode {
            background: #f5f5f5;
            color: #000000;
        }

        /* ডাইনামিক আইল্যান্ড */
        .dynamic-island {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 12px 20px;
            margin: 12px 16px 8px 16px;
            border-radius: 34px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            position: sticky;
            top: 12px;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
        }

        body.light-mode .dynamic-island {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #0AFF56, #65E65C);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            box-shadow: 0 4px 12px rgba(10, 255, 63, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .app-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #8e8e93);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #ff3b30;
            font-weight: 600;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .header-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .theme-toggle, .share-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #ffffff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        body.light-mode .theme-toggle,
        body.light-mode .share-btn {
            background: rgba(0, 0, 0, 0.06);
            color: #000000;
        }

        .theme-toggle:hover, .share-btn:hover {
            transform: scale(1.1);
        }

        .filter-container {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.06);
            padding: 3px;
            border-radius: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 5px 12px;
            border: none;
            border-radius: 16px;
            background: transparent;
            color: #8e8e93;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: #5AFF0A;
            color: white;
            box-shadow: 0 4px 12px rgba(73, 255, 10, 0.3);
        }

        .filter-btn:hover:not(.active) {
            color: #ffffff;
        }

        /* সার্চ বক্স */
        .search-container {
            padding: 0 16px;
            margin-top: 10px;
        }

        .search-box {
            width: 100%;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(28, 28, 30, 0.6);
            color: white;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(20px);
            transition: all 0.3s;
        }

        body.light-mode .search-box {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #000000;
        }

        .search-box:focus {
            border-color: #1AFF0A;
            box-shadow: 0 0 0 3px rgba(255, 77, 10, 0.2);
        }

        /* প্লেয়ার */
        .player-section {
            padding: 0 16px;
            margin-top: 8px;
        }

        .player-card {
            background: rgba(28, 28, 30, 0.75);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        body.light-mode .player-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .player-wrapper {
            aspect-ratio: 16/9;
            background: #0a0a0a;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .player-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #000;
        }

        .player-wrapper video.contain {
            object-fit: contain;
        }

        .player-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #636366;
            background: radial-gradient(ellipse at center, #1c1c1e 0%, #0a0a0a 100%);
        }

        .player-placeholder i {
            font-size: 48px;
            margin-bottom: 12px;
            color: #3a3a3c;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 50%;
        }

        .player-placeholder p {
            font-size: 15px;
            font-weight: 500;
            color: #636366;
        }

        .player-info {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(28, 28, 30, 0.5);
            flex-wrap: wrap;
            gap: 8px;
        }

        body.light-mode .player-info {
            background: rgba(255, 255, 255, 0.5);
        }

        .player-info .now-playing {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-width: 100px;
        }

        .player-info .now-playing .title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        body.light-mode .player-info .now-playing .title {
            color: #000000;
        }

        .player-info .now-playing .subtitle {
            font-size: 11px;
            color: #8e8e93;
        }

        .player-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .player-controls button {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.light-mode .player-controls button {
            background: rgba(0, 0, 0, 0.05);
            color: #000000;
        }

        .player-controls button:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.05);
        }

        .player-controls button:active {
            transform: scale(0.92);
        }

        .volume-slider {
            width: 50px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
        }

        body.light-mode .volume-slider {
            background: rgba(0, 0, 0, 0.2);
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #FF0A0A;
            cursor: pointer;
        }

        /* চ্যানেল ক্যাটাগরি */
        .category-chips {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .category-chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(28, 28, 30, 0.6);
            color: #8e8e93;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        body.light-mode .chip {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .chip.active {
            background: #0AFF17;
            color: white;
            border-color: #FF0AD3;
        }

        .chip:hover:not(.active) {
            border-color: rgba(255,255,255,0.3);
            color: white;
        }

        /* চ্যানেল লিস্ট */
        .channels-section {
            padding: 0 16px 16px 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 12px 4px;
        }

        .section-header h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .section-header .count {
            font-size: 12px;
            color: #8e8e93;
            font-weight: 500;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            padding-bottom: 12px;
        }

        .channel-card {
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        body.light-mode .channel-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .channel-card::before {
            content: \'\';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, transparent 100%);
            pointer-events: none;
        }

        .channel-card:active {
            transform: scale(0.95);
        }

        .channel-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .channel-card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px;
            transition: all 0.3s;
        }

        .channel-card:hover img {
            transform: scale(1.08);
        }

        .channel-card .channel-name {
            font-size: 12px;
            font-weight: 500;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #ffffff;
        }

        body.light-mode .channel-card .channel-name {
            color: #000000;
        }

        .channel-card .channel-group {
            font-size: 9px;
            font-weight: 500;
            color: #8e8e93;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .channel-card .favorite-btn {
            position: absolute;
            top: 6px;
            left: 6px;
            background: none;
            border: none;
            color: #636366;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2;
        }

        .channel-card .favorite-btn.active {
            color: #FFD700;
        }

        .channel-card .channel-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 9px;
            background: rgba(10, 132, 255, 0.2);
            color: #0A84FF;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .loading-state, .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: #636366;
        }

        .loading-state i, .empty-state i {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
            color: #3a3a3c;
        }
        
        .footer {
    margin-top: 30px;
    padding: 25px 15px;
    background: rgba(28, 28, 30, .75);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 255, 255, .08);
    text-align: center;
}

.footer h3 {
    font-size: 20px;
    margin-bottom: 8px;
    color: #0A84FF;
}

.footer p {
    color: #b0b0b0;
    font-size: 14px;
    margin: 6px 0;
}

.footer-links {
    margin: 15px 0;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.footer-links a {
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    transition: .3s;
}

.footer-links a:hover {
    color: #0A84FF;
}

.footer-links i {
    margin-right: 6px;
}

.copyright {
    margin-top: 12px;
    font-size: 12px;
    color: #8e8e93;
}

        .loading-state .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.05);
            border-top-color: #0A84FF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* টোস্ট */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(20px);
            padding: 10px 24px;
            border-radius: 20px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            z-index: 999;
            animation: slideUp 0.5s ease;
            display: none;
            max-width: 90%;
            text-align: center;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* স্ক্রিনশট মোডাল */
        .screenshot-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .screenshot-modal.active {
            display: flex;
        }

        .screenshot-modal img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .screenshot-modal .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .screenshot-modal .close-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        @media (max-width: 480px) {
            .dynamic-island {
                padding: 8px 12px;
                margin: 8px 10px 4px 10px;
                border-radius: 24px;
            }
            .app-name { font-size: 15px; }
            .filter-btn { font-size: 10px; padding: 4px 10px; }
            .channel-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
            .player-info { flex-direction: column; align-items: stretch; }
            .player-controls { justify-content: center; }
            .section-header h2 { font-size: 16px; }
            .volume-slider { width: 40px; }
            .search-box { font-size: 13px; padding: 8px 14px; }
            .chip { font-size: 11px; padding: 4px 12px; }
            .category-chips { padding: 8px 12px; }
            .live-indicator { font-size: 10px; }
        }

        @media (min-width: 768px) {
            .channel-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <!-- স্ক্রিনশট মোডাল -->
    <div id="screenshotModal" class="screenshot-modal">
        <button class="close-btn" onclick="closeScreenshot()"><i class="fas fa-times"></i></button>
        <img id="screenshotImg" src="" alt="স্ক্রিনশট">
    </div>

    <!-- হেডার -->
    <div class="dynamic-island">
        <div class="app-brand">
            <div class="app-icon"><i class="fas fa-play"></i></div>
            <span class="app-name">R9 Nova TV</span>
            <div class="live-indicator">
                <span class="live-dot"></span>
                <span>লাইভ</span>
            </div>
        </div>
        <div class="header-controls">
            <button class="share-btn" onclick="shareApp()" title="শেয়ার"><i class="fas fa-share-alt"></i></button>
            <button class="theme-toggle" id="themeToggle" title="থিম"><i class="fas fa-moon"></i></button>
            <div class="filter-container" id="filterContainer">
                <button class="filter-btn active" data-filter="all">সব</button>
                <button class="filter-btn" data-filter="favorites">★</button>
            </div>
        </div>
    </div>

    <!-- ক্যাটাগরি -->
    <div class="category-chips" id="categoryChips">
        <button class="chip active" data-category="all">📺 সব</button>
        <button class="chip" data-category="bangla">🇧🇩 বাংলা</button>
        <button class="chip" data-category="news">📰 নিউজ</button>
        <button class="chip" data-category="sports">⚽ স্পোর্টস</button>
        <button class="chip" data-category="music">🎵 মিউজিক</button>
        <button class="chip" data-category="movie">🎬 সিনেমা</button>
        <button class="chip" data-category="entertainment">🎭 বিনোদন</button>
    </div>

    <!-- সার্চ -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 চ্যানেল সার্চ করুন...">
    </div>

    <!-- প্লেয়ার -->
    <div class="player-section">
        <div class="player-card">
            <div class="player-wrapper">
                <video id="videoPlayer" controls playsinline></video>
                <div id="playerPlaceholder" class="player-placeholder">
                    <i class="fas fa-play-circle"></i>
                    <p>চ্যানেল সিলেক্ট করুন</p>
                </div>
            </div>
            <div class="player-info">
                <div class="now-playing">
                    <span class="title" id="nowPlayingTitle">কিছুই চলছে না</span>
                    <span class="subtitle" id="nowPlayingGroup">একটি চ্যানেল বেছে নিন</span>
                </div>
                <div class="player-controls">
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.1" value="1">
                    <button id="screenshotBtn" title="স্ক্রিনশট"><i class="fas fa-camera"></i></button>
                    <button id="fullscreenBtn" title="পূর্ণস্ক্রিন"><i class="fas fa-expand"></i></button>
                    <button id="stopBtn" title="স্টপ"><i class="fas fa-stop"></i></button>
                    <button id="refreshBtn" title="রিফ্রেশ"><i class="fas fa-rotate"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- চ্যানেল লিস্ট -->
    <div class="channels-section">
        <div class="section-header">
            <h2>📡 চ্যানেল</h2>
            <span class="count" id="channelCount">০টি</span>
        </div>
        <div id="channelList" class="channel-grid">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>চ্যানেল লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

<script>
    // ----- কনফিগারেশন -----
    const PLAYLISTS = {
        all: \'https://raw.githubusercontent.com/imShakil/tvlink/refs/heads/main/iptv.m3u8\',
        bd: \'https://iptv-org.github.io/iptv/countries/bd.m3u\',
        news: \'https://iptv-org.github.io/iptv/categories/news.m3u\'
    };

    // ----- ডম এলিমেন্ট -----
    const video = document.getElementById(\'videoPlayer\');
    const placeholder = document.getElementById(\'playerPlaceholder\');
    const channelList = document.getElementById(\'channelList\');
    const channelCount = document.getElementById(\'channelCount\');
    const nowTitle = document.getElementById(\'nowPlayingTitle\');
    const nowGroup = document.getElementById(\'nowPlayingGroup\');
    const filterBtns = document.querySelectorAll(\'.filter-btn\');
    const stopBtn = document.getElementById(\'stopBtn\');
    const refreshBtn = document.getElementById(\'refreshBtn\');
    const fullscreenBtn = document.getElementById(\'fullscreenBtn\');
    const screenshotBtn = document.getElementById(\'screenshotBtn\');
    const searchInput = document.getElementById(\'searchInput\');
    const themeToggle = document.getElementById(\'themeToggle\');
    const volumeSlider = document.getElementById(\'volumeSlider\');
    const toast = document.getElementById(\'toast\');
    const categoryChips = document.querySelectorAll(\'.chip\');
    const screenshotModal = document.getElementById(\'screenshotModal\');
    const screenshotImg = document.getElementById(\'screenshotImg\');

    let allChannels = [];
    let currentFilter = \'all\';
    let currentCategory = \'all\';
    let searchQuery = \'\';
    let hls = null;
    let currentUrl = \'\';
    let favorites = JSON.parse(localStorage.getItem(\'tv_favorites\') || \'[]\');
    let darkMode = true;
    let toastTimeout = null;
    let currentChannelName = \'\';

    // ----- টোস্ট -----
    function showToast(message) {
        toast.textContent = message;
        toast.style.display = \'block\';
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.style.display = \'none\';
        }, 2000);
    }

    // ----- থিম -----
    function toggleTheme() {
        darkMode = !darkMode;
        document.body.classList.toggle(\'light-mode\', !darkMode);
        const icon = themeToggle.querySelector(\'i\');
        icon.className = darkMode ? \'fas fa-moon\' : \'fas fa-sun\';
        localStorage.setItem(\'tv_theme\', darkMode ? \'dark\' : \'light\');
        showToast(darkMode ? \'🌙 ডার্ক মোড\' : \'☀️ লাইট মোড\');
    }

    const savedTheme = localStorage.getItem(\'tv_theme\');
    if (savedTheme === \'light\') {
        darkMode = false;
        document.body.classList.add(\'light-mode\');
        themeToggle.querySelector(\'i\').className = \'fas fa-sun\';
    }
    themeToggle.addEventListener(\'click\', toggleTheme);

    // ----- শেয়ার -----
    function shareApp() {
        if (navigator.share) {
            navigator.share({
                title: \'R9 Nova TV\',
                text: \'📺 লাইভ টিভি দেখুন R9 Nova TV-তে!\',
                url: window.location.href
            }).catch(() => {});
        } else {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast(\'📋 লিংক কপি করা হয়েছে!\');
            });
        }
    }

    // ----- স্ক্রিনশট -----
    function takeScreenshot() {
        if (!currentUrl) {
            showToast(\'⚠️ প্রথমে একটি চ্যানেল চালান\');
            return;
        }
        
        const canvas = document.createElement(\'canvas\');
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        const ctx = canvas.getContext(\'2d\');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const dataUrl = canvas.toDataURL(\'image/png\');
        screenshotImg.src = dataUrl;
        screenshotModal.classList.add(\'active\');
        showToast(\'📸 স্ক্রিনশট নেওয়া হয়েছে!\');
    }

    function closeScreenshot() {
        screenshotModal.classList.remove(\'active\');
    }

    screenshotBtn.addEventListener(\'click\', takeScreenshot);
    screenshotModal.addEventListener(\'click\', (e) => {
        if (e.target === screenshotModal) closeScreenshot();
    });

    // ----- M3U পার্সার -----
    function parseM3U(data) {
        const lines = data.split(/\r?\n/);
        const channels = [];
        let current = null;

        for (let line of lines) {
            line = line.trim();
            if (!line) continue;

            if (line.startsWith(\'#EXTINF:\')) {
                const nameMatch = line.match(/,([^,]+)$/);
                const name = nameMatch ? nameMatch[1].trim() : \'অজানা\';
                const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                const logo = logoMatch ? logoMatch[1] : \'\';
                const groupMatch = line.match(/group-title="([^"]*)"/);
                const group = groupMatch ? groupMatch[1].trim() : \'অন্যান্য\';
                current = { name, logo, group, url: \'\' };
            } 
            else if (current && !line.startsWith(\'#\') && line.includes(\'http\')) {
                current.url = line;
                if (current.url) channels.push(current);
                current = null;
            }
        }
        return channels;
    }

    // ----- প্লেলিস্ট ফেচ -----
    async function fetchPlaylist(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.text();
            return parseM3U(data);
        } catch (err) {
            console.warn(\'প্লেলিস্ট লোডে সমস্যা:\', err);
            return [];
        }
    }

    // ----- ক্যাটাগরি ডিটেক্ট -----
    function detectCategory(name, group) {
        const text = (name + \' \' + group).toLowerCase();
        if (text.includes(\'news\') || text.includes(\'নিউজ\') || text.includes(\'bbc\') || text.includes(\'cnn\')) return \'news\';
        if (text.includes(\'sport\') || text.includes(\'স্পোর্টস\') || text.includes(\'football\') || text.includes(\'cricket\')) return \'sports\';
        if (text.includes(\'music\') || text.includes(\'মিউজিক\') || text.includes(\'song\') || text.includes(\'mtv\')) return \'music\';
        if (text.includes(\'movie\') || text.includes(\'সিনেমা\') || text.includes(\'film\') || text.includes(\'hollywood\')) return \'movie\';
        if (text.includes(\'entertainment\') || text.includes(\'বিনোদন\') || text.includes(\'comedy\') || text.includes(\'drama\')) return \'entertainment\';
        if (text.includes(\'bangla\') || text.includes(\'বাংলা\') || text.includes(\'bd\') || text.includes(\'bangladesh\')) return \'bangla\';
        return \'all\';
    }

    // ----- সব প্লেলিস্ট লোড -----
    async function loadAllPlaylists() {
        channelList.innerHTML = `<div class="loading-state"><div class="spinner"></div><p>প্লেলিস্ট লোড হচ্ছে...</p></div>`;

        try {
            const [allData, bdData, newsData] = await Promise.allSettled([
                fetchPlaylist(PLAYLISTS.all),
                fetchPlaylist(PLAYLISTS.bd),
                fetchPlaylist(PLAYLISTS.news)
            ]);

            const successful = [allData, bdData, newsData]
                .filter(p => p.status === \'fulfilled\')
                .map(p => p.value);

            let combined = [];
            successful.forEach((data, index) => {
                const source = [\'all\', \'bd\', \'news\'][index] || \'unknown\';
                data.forEach(ch => {
                    combined.push({ 
                        ...ch, 
                        source,
                        category: detectCategory(ch.name, ch.group)
                    });
                });
            });

            const unique = [];
            const seen = new Set();
            for (const ch of combined) {
                const key = ch.url + \'|\' + ch.name;
                if (!seen.has(key) && ch.url) {
                    seen.add(key);
                    unique.push(ch);
                }
            }

            allChannels = unique;
            applyFilters();
            showToast(`✅ ${allChannels.length}টি চ্যানেল লোড হয়েছে`);

        } catch (err) {
            channelList.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>লোড করতে সমস্যা: ${err.message}</p></div>`;
        }
    }

    // ----- ফিল্টার প্রয়োগ -----
    function applyFilters() {
        let filtered = allChannels;

        // ফিল্টার
        if (currentFilter === \'favorites\') {
            filtered = filtered.filter(ch => favorites.includes(ch.name));
        }

        // ক্যাটাগরি
        if (currentCategory !== \'all\') {
            filtered = filtered.filter(ch => ch.category === currentCategory);
        }

        // সার্চ
        if (searchQuery) {
            filtered = filtered.filter(ch => 
                ch.name.toLowerCase().includes(searchQuery) ||
                ch.group.toLowerCase().includes(searchQuery)
            );
        }

        renderChannels(filtered);
        updateFilterButtons(currentFilter);
        updateChips(currentCategory);
    }

    // ----- ফিল্টার বাটন আপডেট -----
    function updateFilterButtons(filter) {
        filterBtns.forEach(btn => {
            btn.classList.toggle(\'active\', btn.dataset.filter === filter);
        });
    }

    // ----- চিপস আপডেট -----
    function updateChips(category) {
        categoryChips.forEach(chip => {
            chip.classList.toggle(\'active\', chip.dataset.category === category);
        });
    }

    // ----- চ্যানেল রেন্ডার -----
    function renderChannels(channels) {
        channelCount.textContent = `${channels.length}টি`;

        if (!channels || channels.length === 0) {
            channelList.innerHTML = `<div class="empty-state"><i class="fas fa-tv"></i><p>এই ক্যাটাগরিতে কোনো চ্যানেল নেই</p></div>`;
            return;
        }

        let html = \'\';
        for (const ch of channels) {
            const logo = ch.logo || \'https://via.placeholder.com/50x50/1c1c1e/636366?text=?\';
            const initial = ch.name.charAt(0).toUpperCase();
            const isFavorite = favorites.includes(ch.name);
            const categoryEmoji = {
                \'news\': \'📰\', \'sports\': \'⚽\', \'music\': \'🎵\', 
                \'movie\': \'🎬\', \'entertainment\': \'🎭\', \'bangla\': \'🇧🇩\'
            }[ch.category] || \'📺\';
            
            html += `
                <div class="channel-card" data-url="${ch.url}" data-name="${ch.name}" data-group="${ch.group}">
                    <button class="favorite-btn ${isFavorite ? \'active\' : \'\'}" data-name="${ch.name}">
                        <i class="fas fa-star"></i>
                    </button>
                    <span class="channel-badge">${categoryEmoji}</span>
                    <img src="${logo}" alt="${ch.name}" loading="lazy" 
                         onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">
                    <div style="display:none; width:50px; height:50px; border-radius:12px; background:rgba(10,132,255,0.15); align-items:center; justify-content:center; font-size:18px; font-weight:600; color:#0A84FF;">
                        ${initial}
                    </div>
                    <span class="channel-name">${ch.name}</span>
                    <span class="channel-group">${ch.group}</span>
                </div>
            `;
        }
        channelList.innerHTML = html;

        // ফেভারিট বাটন
        document.querySelectorAll(\'.favorite-btn\').forEach(btn => {
            btn.addEventListener(\'click\', function(e) {
                e.stopPropagation();
                const name = this.dataset.name;
                toggleFavorite(name);
                this.classList.toggle(\'active\');
            });
        });

        // চ্যানেল ক্লিক
        document.querySelectorAll(\'.channel-card\').forEach(card => {
            card.addEventListener(\'click\', function() {
                const url = this.dataset.url;
                const name = this.dataset.name;
                const group = this.dataset.group;
                playChannel(url, name, group);
            });
        });
    }

    // ----- ফেভারিট -----
    function toggleFavorite(name) {
        const index = favorites.indexOf(name);
        if (index > -1) {
            favorites.splice(index, 1);
            showToast(`💔 "${name}" ফেভারিট থেকে রিমুভ`);
        } else {
            favorites.push(name);
            showToast(`❤️ "${name}" ফেভারিটে যোগ`);
        }
        localStorage.setItem(\'tv_favorites\', JSON.stringify(favorites));
        if (currentFilter === \'favorites\') applyFilters();
    }

    // ----- ভিডিও চালানো -----
    function playChannel(url, name, group) {
        if (!url) {
            showToast(\'⚠️ এই চ্যানেলের জন্য কোনো লিংক নেই\');
            return;
        }

        currentUrl = url;
        currentChannelName = name;
        nowTitle.textContent = name || \'অজানা চ্যানেল\';
        nowGroup.textContent = group || \'লাইভ\';
        placeholder.style.display = \'none\';
        video.style.display = \'block\';

        if (hls) {
            hls.destroy();
            hls = null;
        }

        if (video.canPlayType(\'application/vnd.apple.mpegurl\')) {
            video.src = url;
        } 
        else if (Hls.isSupported()) {
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(() => {});
            });
            hls.on(Hls.Events.ERROR, (e, data) => {
                if (data.fatal) {
                    console.warn(\'HLS ফ্যাটাল এরর:\', data);
                    showToast(\'⚠️ চ্যানেল লোড করতে সমস্যা\');
                }
            });
        } 
        else {
            showToast(\'❌ আপনার ব্রাউজার HLS সাপোর্ট করে না\');
            return;
        }

        video.play().catch(err => {
            console.warn(\'অটোপ্লে ব্লক:\', err);
        });

        document.title = `${name} - R9 Nova TV`;
        showToast(`▶️ "${name}" চালানো হচ্ছে`);
    }

    // ----- স্টপ -----
    function stopVideo() {
        if (hls) {
            hls.destroy();
            hls = null;
        }
        video.pause();
        video.src = \'\';
        video.style.display = \'none\';
        placeholder.style.display = \'flex\';
        nowTitle.textContent = \'কিছুই চলছে না\';
        nowGroup.textContent = \'একটি চ্যানেল বেছে নিন\';
        document.title = \'R9 Nova TV\';
        currentUrl = \'\';
        showToast(\'⏹️ স্টপ করা হয়েছে\');
    }

    // ----- রিফ্রেশ -----
    function refreshVideo() {
        if (currentUrl) {
            const name = nowTitle.textContent;
            const group = nowGroup.textContent;
            playChannel(currentUrl, name, group);
            showToast(\'🔄 রিফ্রেশ করা হচ্ছে\');
        }
    }

    // ----- ফুলস্ক্রিন -----
    function toggleFullscreen() {
        const player = document.querySelector(\'.player-card\');
        if (!document.fullscreenElement) {
            player.requestFullscreen().catch(() => {
                showToast(\'❌ ফুলস্ক্রিন সাপোর্ট করে না\');
            });
        } else {
            document.exitFullscreen();
        }
    }

    // ----- ভলিউম -----
    volumeSlider.addEventListener(\'input\', function() {
        video.volume = this.value;
    });

    // ----- ইভেন্ট -----
    filterBtns.forEach(btn => {
        btn.addEventListener(\'click\', function() {
            currentFilter = this.dataset.filter;
            applyFilters();
        });
    });

    categoryChips.forEach(chip => {
        chip.addEventListener(\'click\', function() {
            currentCategory = this.dataset.category;
            applyFilters();
        });
    });

    searchInput.addEventListener(\'input\', function(e) {
        searchQuery = e.target.value.toLowerCase().trim();
        applyFilters();
    });

    stopBtn.addEventListener(\'click\', stopVideo);
    refreshBtn.addEventListener(\'click\', refreshVideo);
    fullscreenBtn.addEventListener(\'click\', toggleFullscreen);

    video.addEventListener(\'ended\', () => {
        stopVideo();
    });

    // ----- কিবোর্ড -----
    document.addEventListener(\'keydown\', (e) => {
        if (e.key === \'f\' || e.key === \'F\') toggleFullscreen();
        if (e.key === \'Escape\') {
            if (document.fullscreenElement) document.exitFullscreen();
            if (screenshotModal.classList.contains(\'active\')) closeScreenshot();
        }
        if (e.key === \'s\' || e.key === \'S\') takeScreenshot();
    });

    // ----- শুরু -----
    window.addEventListener(\'load\', () => {
        video.style.display = \'none\';
        placeholder.style.display = \'flex\';
        loadAllPlaylists();
    });
</script>
